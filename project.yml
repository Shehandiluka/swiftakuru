name: SwiftAkuru
options:
  bundleIdPrefix: store.swiftpaypos
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.6.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # put your Apple Team ID here when you have a paid account
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  SwiftAkuru:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: TranslateUI
    dependencies:
      - target: SwiftAkuruKeyboard
        embed: true
      - target: SwiftAkuruShare
        embed: true
    entitlements:
      path: App/SwiftAkuru.entitlements
      properties:
        com.apple.security.application-groups: [group.store.swiftpaypos.swiftakuru]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Swift Akuru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSPhotoLibraryUsageDescription: Keyboard background එකට photo එකක් තෝරන්න.
        NSFaceIDUsageDescription: Secret Chats Face ID එකෙන් විවෘත කරන්න.
        NSMicrophoneUsageDescription: Chat එකේ voice messages record කරන්න.
        CFBundleURLTypes:
          - CFBundleURLName: store.swiftpaypos.swiftakuru
            CFBundleURLSchemes: [swiftakuru]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: store.swiftpaypos.swiftakuru
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SwiftAkuruKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
    entitlements:
      path: Keyboard/SwiftAkuruKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.store.swiftpaypos.swiftakuru]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Swift Akuru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: si-LK
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: store.swiftpaypos.swiftakuru.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
  SwiftAkuruShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
      - path: Shared
      - path: TranslateUI
    entitlements:
      path: Share/SwiftAkuruShare.entitlements
      properties:
        com.apple.security.application-groups: [group.store.swiftpaypos.swiftakuru]
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Swift Akuru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: store.swiftpaypos.swiftakuru.share
        APPLICATION_EXTENSION_API_ONLY: YES
  SwiftAkuruTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: store.swiftpaypos.swiftakuru.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SwiftAkuruTests:
    build:
      targets:
        SwiftAkuruTests: [test]
    test:
      targets: [SwiftAkuruTests]
