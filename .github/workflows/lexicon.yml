name: Build Sinhala lexicon
on:
  workflow_dispatch:
  push:
    paths: ["tools/lexicon/**"]
permissions:
  contents: read
jobs:
  lexicon:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build counts from public corpora
        working-directory: tools/lexicon
        run: python3 build.py ../../Shared/Resources/words_si.txt
      - name: Skeleton index (same Singlish code as the keyboard)
        run: |
          swiftc -O tools/lexicon/skel_main.swift Shared/Singlish.swift -o /tmp/skel
          /tmp/skel tools/lexicon/out/words.tsv tools/lexicon/out/lex.tsv
          ls -la tools/lexicon/out
      - uses: actions/upload-artifact@v4
        with:
          name: si-lexicon
          path: |
            tools/lexicon/out/words.tsv
            tools/lexicon/out/bigrams.tsv
            tools/lexicon/out/lex.tsv
