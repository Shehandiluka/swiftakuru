# Builds an unsigned SwiftAkuru.ipa on a GitHub cloud Mac. Sign/install it with Sideloadly (Windows) or AltStore.
name: Build iOS
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project SwiftAkuru.xcodeproj -scheme SwiftAkuru -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > xcodebuild.log 2>&1 \
            || (grep -E "error:" xcodebuild.log | head -40; tail -40 xcodebuild.log; exit 1)
          tail -3 xcodebuild.log
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SwiftAkuru.app Payload/
          zip -qry SwiftAkuru-unsigned.ipa Payload
          ls -la SwiftAkuru-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: SwiftAkuru-unsigned-ipa
          path: SwiftAkuru-unsigned.ipa
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
