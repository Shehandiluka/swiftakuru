# Builds Swift Akuru on a GitHub cloud Mac and publishes it as a GitHub Release with:
#   SwiftAkuru.ipa   – unsigned; install with SideStore / AltStore (on the phone) or Sideloadly (PC)
#   update.json      – read by the app & keyboard to show "update available"
#   altstore.json    – SideStore / AltStore source for one-tap & automatic updates
name: Build iOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project SwiftAkuru.xcodeproj -scheme SwiftAkuru -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build > xcodebuild.log 2>&1 \
            || (grep -E "error:" xcodebuild.log | head -40; tail -40 xcodebuild.log; exit 1)
          tail -3 xcodebuild.log
      - name: Package IPA + update feeds
        env:
          RUN: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SwiftAkuru.app Payload/
          zip -qry SwiftAkuru.ipa Payload
          VER=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v$VER-$RUN"
          echo "TAG=$TAG" >> $GITHUB_ENV
          git log -1 --pretty=%B | grep -vE '^(Co-Authored-By|Claude-Session):' | sed '/^\s*$/d' > notes.txt
          python3 - "$VER" "$RUN" "$TAG" "$REPO" <<'PY'
          import json, os, sys, datetime
          ver, run, tag, repo = sys.argv[1:5]
          ipa = f"https://github.com/{repo}/releases/download/{tag}/SwiftAkuru.ipa"
          size = os.path.getsize("SwiftAkuru.ipa")
          notes = [l.strip().lstrip("-• ").strip() for l in open("notes.txt") if l.strip()]
          now = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
          json.dump({"version": ver, "build": int(run), "date": now, "notes": notes, "ipa": ipa, "size": size}, open("update.json", "w"), ensure_ascii=False, indent=1)
          icon = f"https://raw.githubusercontent.com/{repo}/main/App/Assets.xcassets/Logo.imageset/logo.png"
          src = {"name": "Swift Akuru", "identifier": "store.swiftpaypos.swiftakuru.source", "subtitle": "Sinhala keyboard by SwiftPayPOS",
                 "iconURL": icon, "website": "https://swiftlk.com", "tintColor": "3B6CFF",
                 "apps": [{"name": "Swift Akuru", "bundleIdentifier": "store.swiftpaypos.swiftakuru", "developerName": "SwiftPayPOS (Private) Limited",
                           "subtitle": "Singlish → සිංහල keyboard with AI", "localizedDescription": "Sinhala (Singlish) keyboard with smart suggestions, AI translate, grammar fix, clipboard history, emoji and themes.",
                           "iconURL": icon, "tintColor": "3B6CFF", "category": "utilities",
                           "versions": [{"version": ver, "buildVersion": run, "date": now, "localizedDescription": "\n".join(notes), "downloadURL": ipa, "size": size, "minOSVersion": "16.0"}],
                           "appPermissions": {"entitlements": [], "privacy": {}}}],
                 "news": []}
          json.dump(src, open("altstore.json", "w"), ensure_ascii=False, indent=1)
          print(open("update.json").read())
          PY
          cp SwiftAkuru.ipa SwiftAkuru-unsigned.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" SwiftAkuru.ipa SwiftAkuru-unsigned.ipa update.json altstore.json \
            --title "Swift Akuru $TAG" --notes-file notes.txt --latest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
